<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações | Plataforma Inteligente</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
        .config-section { padding: 2rem; margin-bottom: 2rem; }
        .readonly-field { background: rgba(255, 255, 255, 0.1) !important; color: #ccc !important; cursor: not-allowed; }
        .form-control { background: #0d1a30; }
    </style>
</head>
<body>
    <div class="app-container">
         <aside class="sidebar">
            <div class="sidebar-logo" style="display: flex; align-items:center; gap: 10px;">
                <img src="assets/img/logo_prefeitura.png" alt="Logo Prefeitura da Iracemápolis" style="height: 35px; width: auto; object-fit: contain;">
                <span>SIGDEI</span>
            </div>
            <ul class="nav-menu">
                <li><a href="dashboard.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i> Painel de Controle</a></li>
                <li><a href="oficios.html" class="nav-link"><i class="fa-solid fa-file-signature"></i> Ofícios</a></li>
                <li><a href="projetos.html" class="nav-link"><i class="fa-solid fa-project-diagram"></i> Projetos</a></li>
                <li><a href="indicadores.html" class="nav-link"><i class="fa-solid fa-chart-bar"></i> Indicadores</a></li>
                
                <li id="menu-usuarios" style="display:none;"><a href="usuarios.html" class="nav-link"><i class="fa-solid fa-users"></i> Usuários</a></li>
                <li><a href="configuracoes.html" class="nav-link active"><i class="fa-solid fa-gear"></i> Configurações</a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="header glass" style="padding: 1rem 2rem; border-radius: 12px; margin-bottom: 2rem;">
                <h2 class="page-title">Configurações da Conta</h2>
                <div class="user-profile">
                    <div class="user-info" style="text-align: right;">
                        <h4 id="user-name">Carregando...</h4>
                        <p id="user-role">Carregando...</p>
                    </div>
                    <div id="user-avatar" style="width: 40px; height: 40px; border-radius: 50%; background: var(--primary-color); display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 1.2rem;">-</div>
                    <a href="#" id="logout-btn" style="color: var(--text-muted); margin-left: 1rem;" title="Sair"><i class="fa-solid fa-right-from-bracket"></i></a>
                </div>
            </header>

            <div id="alert-box" class="alert" style="display:none;"></div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem;">
                <div class="glass config-section">
                    <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;"><i class="fa-solid fa-id-card"></i> Meu Cadastro</h3>
                    <form id="form-perfil">
                        <div class="form-group">
                            <label class="form-label" for="matricula">Matrícula (Login)</label>
                            <input type="text" id="matricula" class="form-control readonly-field" readonly title="A matrícula não pode ser alterada">
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="nome">Nome Completo</label>
                            <input type="text" id="nome" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="funcao">Função</label>
                            <input type="text" id="funcao" class="form-control" required>
                        </div>
                        <div class="grid-form">
                            <div class="form-group">
                                <label class="form-label">Setor</label>
                                <input type="text" id="nome_setor" class="form-control readonly-field" readonly>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Departamento</label>
                                <input type="text" id="nome_departamento" class="form-control readonly-field" readonly>
                            </div>
                            <div class="form-group">
                                <label class="form-label">Nível de Acesso</label>
                                <input type="text" id="nivel_acesso" class="form-control readonly-field" readonly>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 1rem;"><i class="fa-solid fa-save"></i> Atualizar Dados</button>
                    </form>
                </div>

                <div class="glass config-section">
                    <h3 style="margin-bottom: 1.5rem; font-size: 1.2rem;"><i class="fa-solid fa-lock"></i> Alterar Senha</h3>
                    <form id="form-senha">
                        <div class="form-group">
                            <label class="form-label" for="senha_atual">Senha Atual</label>
                            <input type="password" id="senha_atual" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="nova_senha">Nova Senha</label>
                            <input type="password" id="nova_senha" class="form-control" placeholder="Min 6 chars (Ex: Senha@123)" required>
                        </div>
                        <button type="submit" class="btn btn-primary" style="margin-top: 1rem; background: var(--status-yellow); color: #000;"><i class="fa-solid fa-key"></i> Alterar Senha</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script>
        const token = localStorage.getItem('jwt_token');
        if (!token) window.location.href = 'index.html';
        let user = JSON.parse(localStorage.getItem('user')) || { nome: '', nivel_acesso: '' };
        
        document.getElementById('user-name').textContent = user.nome;
        document.getElementById('user-role').textContent = user.nivel_acesso;
        document.getElementById('user-avatar').textContent = user.nome.charAt(0).toUpperCase();

        if (user.nivel_acesso === 'Administrador' || user.nivel_acesso === 'Gestor') {
            document.getElementById('menu-usuarios').style.display = 'block';
        }

        document.getElementById('logout-btn').addEventListener('click', () => {
            localStorage.removeItem('jwt_token');
            localStorage.removeItem('user');
            window.location.href = 'index.html';
        });

        const apiHeaders = { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' };

        // Preencher form perfil
        document.getElementById('matricula').value = user.matricula || '';
        document.getElementById('nome').value = user.nome || '';
        document.getElementById('funcao').value = user.funcao || '';
        document.getElementById('nivel_acesso').value = user.nivel_acesso || '';

        // Buscar nome do setor
        async function fetchSetor() {
            if(!user.id_setor) return;
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/v1/setores/${user.id_setor}/`, { headers: apiHeaders });
                if(res.ok) {
                    const data = await res.json();
                    document.getElementById('nome_setor').value = data.nome_setor;
                    document.getElementById('nome_departamento').value = data.nome_departamento || 'Não informado';
                }
            } catch(e) {}
        }
        fetchSetor();

        function mostrarAlerta(msg, classe) {
            const box = document.getElementById('alert-box');
            box.textContent = msg;
            box.className = 'alert ' + classe;
            box.style.display = 'block';
            setTimeout(() => box.style.display = 'none', 3000);
        }

        document.getElementById('form-perfil').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                nome: document.getElementById('nome').value,
                funcao: document.getElementById('funcao').value
            };
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/v1/usuarios/${user.id}/`, { method: 'PATCH', headers: apiHeaders, body: JSON.stringify(body) });
                if(res.ok) {
                    mostrarAlerta("Perfil atualizado!", "alert-success");
                    user.nome = body.nome;
                    user.funcao = body.funcao;
                    localStorage.setItem('user', JSON.stringify(user));
                    document.getElementById('user-name').textContent = user.nome;
                    document.getElementById('user-avatar').textContent = user.nome.charAt(0).toUpperCase();
                } else {
                    mostrarAlerta("Erro ao atualizar", "alert-error");
                }
            } catch(e) {}
        });

        document.getElementById('form-senha').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = { 
                user_id: user.id,
                senha_atual: document.getElementById('senha_atual').value,
                nova_senha: document.getElementById('nova_senha').value 
            };
            try {
                const res = await fetch(`http://127.0.0.1:8000/api/v1/usuarios/alterar-senha/`, { 
                    method: 'POST', 
                    headers: apiHeaders, 
                    body: JSON.stringify(body) 
                });
                if(res.ok) {
                    mostrarAlerta("Senha atualizada com sucesso!", "alert-success");
                    e.target.reset();
                } else {
                    const error = await res.json();
                    mostrarAlerta("Erro: " + JSON.stringify(error), "alert-error");
                }
            } catch(e) {}
        });
    </script>
</body>
</html>
